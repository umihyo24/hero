<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Hero Style Tactical Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-row">
          <div id="turn-indicator" class="badge"></div>
          <div id="phase-indicator" class="badge"></div>
        </div>
        <div class="hud-row resources">
          <div id="player-resource" class="resource"></div>
          <div id="enemy-resource" class="resource"></div>
        </div>
        <div id="status"></div>
        <div class="hud-row">
          <button id="end-turn-btn" type="button">ターン終了</button>
          <button id="restart-btn" type="button" class="hidden">リスタート</button>
        </div>
      </header>

      <main>
        <section id="battlefield" aria-label="Battlefield"></section>
      </main>

      <section id="hand-panel" aria-label="Player hand">
        <h2>Hand</h2>
        <div id="hand"></div>
      </section>
    </div>

    <div id="drag-ghost" class="drag-ghost hidden"></div>
    <div id="aim-line" class="aim-line hidden"></div>

    <div id="levelup-overlay" class="overlay hidden" aria-live="polite">
      <div class="overlay-card">
        <h3>レベルアップ選択</h3>
        <p id="levelup-text"></p>
        <div class="overlay-actions">
          <button id="levelup-yes" type="button">Level Up</button>
          <button id="levelup-skip" type="button">Skip</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
