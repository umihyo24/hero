<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Hero Tactical Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div id="turn-indicator"></div>
        <div id="message"></div>
        <button id="end-turn-btn">End Turn</button>
        <button id="restart-btn" class="hidden">Restart</button>
      </header>

      <main id="battlefield"></main>

      <section>
        <h2>Hand</h2>
        <div id="hand"></div>
      </section>
    </div>

    <div id="aim-line" class="hidden"></div>
    <script src="script.js"></script>
  </body>
</html>
